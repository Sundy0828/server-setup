services:
  # -----------------------
  # 🔐 VPN egress for download clients
  # -----------------------
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES=USA
      - TZ=${TZ}
      - FIREWALL_INPUT_PORTS=8080,9696,8191
    ports:
      - "8080:8080"
      - "9696:9696"
      - "8191:8191"
    volumes:
      - ./config/gluetun:/gluetun
    networks:
      - homelab
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:4.6.7
    container_name: qbittorrent
    network_mode: service:gluetun
    depends_on:
      - gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ./config/qbittorrent:/config
      - ${DATA_PATH:-./data}:/data
    labels:
      - "autoheal=true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 https://1.1.1.1/cdn-cgi/trace -o /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Disabled: Mullvad discontinued port forwarding for torrenting in 2023, so this
  # sidecar can never succeed against the current VPN provider. Re-enable when
  # switching to a VPN provider that still supports port forwarding.
  # qbittorrent-port-forward:
  #   image: mjmeli/qbittorrent-port-forward-gluetun-server:latest
  #   container_name: qbittorrent-port-forward
  #   network_mode: service:gluetun
  #   depends_on:
  #     - gluetun
  #     - qbittorrent
  #   environment:
  #     - QBT_USERNAME=${QBT_USERNAME:-admin}
  #     - QBT_PASSWORD=${QBT_PASSWORD}
  #     - QBT_ADDR=http://localhost:8080
  #     - GTN_ADDR=http://localhost:8000
  #   restart: unless-stopped

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    profiles: ["usenet"]
    ports:
      - "${SABNZBD_WEBUI_PORT:-8085}:8080"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/sabnzbd:/config
      - ./data/downloads:/downloads
      - ./data/incomplete-downloads:/incomplete-downloads
    networks:
      - homelab
    restart: unless-stopped

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    ports:
      - "32400:32400/tcp"
      - "1900:1900/udp"
      - "3005:3005/tcp"
      - "8324:8324/tcp"
      - "32410:32410/udp"
      - "32412:32412/udp"
      - "32413:32413/udp"
      - "32414:32414/udp"
      - "32469:32469/tcp"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - ./config/plex:/config
      - ${DATA_PATH:-./data}/media:/data/media
      - ${AUDIOBOOKS_PATH}:/data/audiobooks
      - ${MUSIC_PATH}:/data/music
    networks:
      - homelab
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    ports:
      - "8989:8989"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/sonarr:/config
      - ${DATA_PATH:-./data}:/data
    networks:
      - homelab
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    ports:
      - "7878:7878"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/radarr:/config
      - ${DATA_PATH:-./data}:/data
    networks:
      - homelab
    restart: unless-stopped

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    ports:
      - "8686:8686"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/lidarr:/config
      - ${DATA_PATH:-./data}:/data
    networks:
      - homelab
    restart: unless-stopped

  readarr:
    image: lscr.io/linuxserver/readarr:0.4.19-nightly
    container_name: readarr
    ports:
      - "8787:8787"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/readarr:/config
      - ${DATA_PATH:-./data}:/data
    networks:
      - homelab
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: service:gluetun
    depends_on:
      - gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/prowlarr:/config
    labels:
      - "autoheal=true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 https://1.1.1.1/cdn-cgi/trace -o /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    ports:
      - "6767:6767"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/bazarr:/config
      - ${DATA_PATH:-./data}:/data
    networks:
      - homelab
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    network_mode: service:gluetun
    depends_on:
      - gluetun
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
    labels:
      - "autoheal=true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 https://1.1.1.1/cdn-cgi/trace -o /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    ports:
      - "13378:80"
    environment:
      - TZ=${TZ}
    volumes:
      - ./config/audiobookshelf:/config
      - ./config/audiobookshelf/metadata:/metadata
      - ${AUDIOBOOKS_PATH}:/audiobooks
      - ${DATA_PATH:-./data}/media:/data/media
    networks:
      - homelab
    restart: unless-stopped

  overseerr:
    image: lscr.io/linuxserver/overseerr:latest
    container_name: overseerr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/overseerr:/config
    networks:
      - homelab
    restart: unless-stopped

  tailscale-lidarr:
    image: tailscale/tailscale:latest
    container_name: tailscale-lidarr
    depends_on:
      - lidarr
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    network_mode: service:lidarr
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--hostname=${TS_HOSTNAME_LIDARR} --reset
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./config/tailscale-lidarr/state:/var/lib/tailscale
      - ./config/tailscale-lidarr/serve.json:/config/serve.json:ro
    restart: unless-stopped

  tailscale-overseerr:
    image: tailscale/tailscale:latest
    container_name: tailscale-overseerr
    depends_on:
      - overseerr
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    network_mode: service:overseerr
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--hostname=${TS_HOSTNAME} --reset
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./config/tailscale-overseerr/state:/var/lib/tailscale
      - ./config/tailscale-overseerr/serve.json:/config/serve.json:ro
    restart: unless-stopped

  tailscale-audiobookshelf:
    image: tailscale/tailscale:latest
    container_name: tailscale-audiobookshelf
    depends_on:
      - audiobookshelf
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    network_mode: service:audiobookshelf
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--hostname=${TS_HOSTNAME_ABS} --reset
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./config/tailscale-audiobookshelf/state:/var/lib/tailscale
      - ./config/tailscale-audiobookshelf/serve.json:/config/serve.json:ro
    restart: unless-stopped

networks:
  homelab:
    external: true
