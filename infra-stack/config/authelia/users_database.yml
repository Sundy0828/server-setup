---
# Authelia User Database
# Users are defined here with encrypted passwords
# Generate password hashes using: authelia hash-password <password>

users:
  admin:
    displayname: "Administrator"
    password: "$argon2id$v=19$m=65540,t=3,p=4$aF9TdGRyQ005NmFSVnBOQQ$sKvBZO7t3S0Z2H8L+5tZkVCxW8QrXkF5FqJhJZLpkD0" # password: admin (CHANGE THIS!)
    email: admin@yourdomain.com
    groups:
      - admins
      - users

  user:
    displayname: "Regular User"
    password: "$argon2id$v=19$m=65540,t=3,p=4$NkFsUDJBQWVlTWNMQ0Z4MA$I+TrjUnqKqv8Sm/FvlGJ55K8pXDLVYzKxaI6yNZMXeE" # password: user (CHANGE THIS!)
    email: user@yourdomain.com
    groups:
      - users

# Groups define user roles for access control
