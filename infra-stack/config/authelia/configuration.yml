---
# Authelia Configuration for SSO
# This configuration file provides Single Sign-On for all homelab services

# Server Configuration
server:
  host: 0.0.0.0
  port: 9091
  path_prefix: ""
  asset_path: ""
  enable_pprof: false
  enable_expvars: false
  buffers:
    read: 4096
    write: 4096
  timeouts:
    read: 6s
    write: 6s
    idle: 30s

# Logging Configuration
log:
  level: info
  format: json
  file_path: ""

# Default Redirection URL (after successful authentication)
default_redirection_url: https://homepage.home.lab

# Session Configuration (using Redis)
session:
  name: authelia_session
  domain: home.lab
  same_site: lax
  expiration: 1h
  inactivity: 15m
  remember_me: 1M
  cookies:
    - name: authelia_session
      domain: home.lab
      authelia_url: https://authelia.home.lab
      default_redirection_url: https://homepage.home.lab

# Redis Storage for Sessions
storage:
  encryption_key: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
  local:
    path: /config/db.sqlite3

# Authentication Backend (Local database)
authentication_backend:
  password_reset:
    disable: false
    custom_url: ""
  file:
    path: /config/users_database.yml

# Access Control Rules
access_control:
  default_policy: one_factor

  rules:
    # Bypass rules - no authentication required
    - domain:
        - "home.lab"
      path: "^/api/.*"
      policy: bypass

    # Auth Portal - accessible to all
    - domain:
        - "authelia.home.lab"
      policy: bypass

    # Public services - no auth required (optional, adjust as needed)
    # - domain:
    #     - "status.home.lab"
    #   policy: bypass

    # Protected services - one_factor (password only, or TOTP if enabled)
    - domain:
        - "homepage.home.lab"
        - "portainer.home.lab"
        - "uptime-kuma.home.lab"
        - "adguardhome.home.lab"
        - "homeassistant.home.lab"
        - "duplicati.home.lab"
        - "sonarr.home.lab"
        - "radarr.home.lab"
        - "lidarr.home.lab"
        - "readarr.home.lab"
        - "prowlarr.home.lab"
        - "bazarr.home.lab"
        - "overseerr.home.lab"
        - "minecraft.home.lab"
        - "plex.home.lab"
        - "qbittorrent.home.lab"
        - "sabnzbd.home.lab"
      policy: one_factor
      networks:
        - external

    # Admin panel - two_factor required
    - domain:
        - "admin.home.lab"
      policy: two_factor

# TOTP (Time-based One-Time Password) Configuration
totp:
  disable: false
  issuer: Homelab
  algorithm: sha1
  digits: 6
  period: 30
  skew: 1

