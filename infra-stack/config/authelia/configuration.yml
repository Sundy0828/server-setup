---
# Authelia configuration for homelab SSO (home.lab).
# Secrets are supplied via infra-stack/.env (AUTHELIA_* environment variables).

theme: 'auto'

server:
  address: 'tcp://0.0.0.0:9091/'
  tls:
    key: '/config/certs/tls.key'
    certificate: '/config/certs/tls.crt'

log:
  level: 'info'

identity_validation:
  reset_password:
    jwt_secret: 'placeholder_overridden_by_env'

authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: 'argon2'
      iterations: 3
      key_length: 32
      salt_length: 16
      memory: 65536
      parallelism: 4

access_control:
  default_policy: 'deny'
  rules:
    # Direct local access during setup (before DNS/NPM)
    - domain:
        - 'localhost'
        - '127.0.0.1'
      policy: 'bypass'

    # Login portal — never require forward-auth on itself
    - domain: 'authelia.home.lab'
      policy: 'bypass'

    # Protected homelab services (password only; enable two_factor per-domain if desired)
    - domain:
        - 'homepage.home.lab'
        - 'portainer.home.lab'
        - 'uptime-kuma.home.lab'
        - 'adguardhome.home.lab'
        - 'homeassistant.home.lab'
        - 'duplicati.home.lab'
        - 'sonarr.home.lab'
        - 'radarr.home.lab'
        - 'lidarr.home.lab'
        - 'readarr.home.lab'
        - 'prowlarr.home.lab'
        - 'bazarr.home.lab'
        - 'overseerr.home.lab'
        - 'minecraft.home.lab'
        - 'plex.home.lab'
        - 'qbittorrent.home.lab'
        - 'sabnzbd.home.lab'
      policy: 'one_factor'

    - domain: 'admin.home.lab'
      policy: 'two_factor'

session:
  cookies:
    # Primary — use with hosts entry: 127.0.0.1 authelia.home.lab
    # Direct: https://authelia.home.lab:9091
    # Via NPM later: change authelia_url to https://authelia.home.lab (no port)
    - domain: 'home.lab'
      authelia_url: 'https://authelia.home.lab:9091'
      default_redirection_url: 'https://homepage.home.lab:3000'
    # Fallback — direct IP access: https://127.0.0.1:9091
    - domain: '127.0.0.1'
      authelia_url: 'https://127.0.0.1:9091'
      default_redirection_url: 'https://127.0.0.1:3000'
  expiration: '1h'
  inactivity: '15m'
  redis:
    host: 'redis'
    port: 6379

storage:
  encryption_key: 'placeholder_overridden_by_env'
  local:
    path: /config/db.sqlite3

notifier:
  filesystem:
    filename: /config/notification.txt

totp:
  issuer: 'home.lab'
  period: 30
  skew: 1
