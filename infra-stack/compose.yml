services:
  # -----------------------
  # 🌐 Reverse Proxy & SSL
  # -----------------------
  nginx-db:
    image: mysql:8.0
    container_name: nginx-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-npm-root-pass}
      MYSQL_DATABASE: npm
      MYSQL_USER: npm
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-npm-pass}
    volumes:
      - ./data/nginx/mysql:/var/lib/mysql
    networks:
      - homelab
    restart: unless-stopped

  nginx:
    image: "jc21/nginx-proxy-manager:latest"
    container_name: nginx-pm
    environment:
      DB_MYSQL_HOST: nginx-db
      DB_MYSQL_PORT: 3306
      DB_MYSQL_USER: npm
      DB_MYSQL_PASSWORD: ${MYSQL_PASSWORD:-npm-pass}
      DB_MYSQL_NAME: npm
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - ./data/nginx/letsencrypt:/etc/letsencrypt
      - ./data/nginx/npm:/data
    depends_on:
      - nginx-db
    networks:
      - homelab
    restart: unless-stopped

  # -----------------------
  # 🏠 Homepage Dashboard
  # -----------------------
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports:
      - "3000:3000"
    environment:
      - TZ=${TZ:-America/New_York}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./config/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homelab
    restart: unless-stopped

  # -----------------------
  # ⏰ Monitoring & Uptime
  # -----------------------
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    ports:
      - "3001:3001"
    environment:
      - TZ=${TZ:-America/New_York}
    volumes:
      - ./data/uptime-kuma:/app/data
    networks:
      - homelab
    restart: unless-stopped

  # -----------------------
  # 💾 Backup Solution
  # -----------------------
  # Option 1: Duplicati (web UI included, easier to use)
  duplicati:
    image: lscr.io/linuxserver/duplicati:latest
    container_name: duplicati
    ports:
      - "8200:8200"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
    volumes:
      - ./data/duplicati:/config
      - ./backups:/backups
      # Add your config directories to backup here
      # Mount other stack configs as read-only for backup
      # - ./data/nginx:/source/nginx:ro
      # - ../adblock-stack/config:/source/adblock:ro
      # - ../homeassistant-stack/config:/source/homeassistant:ro
      # - ../plex-stack/config:/source/plex:ro
      - /:/source/system:ro
    networks:
      - homelab
    restart: unless-stopped

  # -----------------------
  # 🔐 Single Sign-On (SSO)
  # -----------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      - TZ=${TZ:-America/New_York}
    volumes:
      - ./data/redis:/data
    networks:
      - homelab
    command: redis-server --appendonly yes
    restart: unless-stopped

  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    ports:
      - "9091:9091"
    environment:
      - TZ=${TZ:-America/New_York}
      - AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET=${AUTHELIA_JWT_SECRET}
      - AUTHELIA_SESSION_SECRET=${AUTHELIA_SESSION_SECRET}
      - AUTHELIA_STORAGE_ENCRYPTION_KEY=${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      # SMTP Configuration - uncomment and set these to enable email notifications
      # - AUTHELIA_NOTIFIER_SMTP_ADDRESS=submission://${AUTHELIA_NOTIFIER_SMTP_HOST:-smtp.gmail.com}:${AUTHELIA_NOTIFIER_SMTP_PORT:-587}
      # - AUTHELIA_NOTIFIER_SMTP_USERNAME=${AUTHELIA_NOTIFIER_SMTP_USERNAME}
      # - AUTHELIA_NOTIFIER_SMTP_PASSWORD=${AUTHELIA_NOTIFIER_SMTP_PASSWORD}
      # - AUTHELIA_NOTIFIER_SMTP_SENDER=${AUTHELIA_NOTIFIER_SMTP_SENDER:-authelia@yourdomain.com}
    volumes:
      - ./config/authelia:/config
      - ./data/authelia:/data
    depends_on:
      - redis
    networks:
      - homelab
    restart: unless-stopped

networks:
  homelab:
    external: true

volumes:
  portainer_data:
    driver: local
  uptime_kuma_data:
    driver: local
  duplicati_config:
    driver: local
