services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3002:3000/tcp"  # first-run setup wizard (container :3000)
      - "8081:80/tcp"    # admin UI + API after setup (container :80)
    environment:
      - TZ=${TZ:-America/New_York}
    volumes:
      - ./config/work:/opt/adguardhome/work
      - ./config/conf:/opt/adguardhome/conf
    networks:
      - homelab
    restart: unless-stopped

networks:
  homelab:
    external: true
